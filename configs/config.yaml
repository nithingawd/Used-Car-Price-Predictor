# Configuration for Used Car Price Prediction System
# All paths, seeds, thresholds, and modeling parameters are centralized here.

project:
  name: "used-car-price-predictor"
  version: "0.1.0"
  random_seed: 42

paths:
  raw_data_path: "data/raw/cardekho_dataset.csv"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  models_dir: "models"
  figures_dir: "reports/figures"
  tables_dir: "reports/tables"
  reports_dir: "reports"

splitting:
  test_size: 0.2
  cv_folds: 5
  stratify_by: null

cleaning:
  # Outlier and validation thresholds (placeholders to be verified during Phase 1 audit)
  km_cap: 500000
  min_price: 20000
  max_price: 25000000
  min_year: 1995
  max_year: 2026
  max_drop_row_fraction: 0.02

features:
  target_column: "selling_price"
  rare_brand_threshold: 30
  rare_fuel_threshold: 40
  luxury_brands:
    - "Audi"
    - "Bentley"
    - "Bmw"
    - "Ferrari"
    - "Jaguar"
    - "Land Rover"
    - "Lexus"
    - "Maserati"
    - "Mercedes-Amg"
    - "Mercedes-Benz"
    - "Mini"
    - "Porsche"
    - "Rolls-Royce"
    - "Volvo"
  brand_tier_mapping:
    Maruti: "Budget"
    Tata: "Budget"
    Datsun: "Budget"
    Hyundai: "Mid"
    Ford: "Mid"
    Honda: "Mid"
    Mahindra: "Mid"
    Nissan: "Mid"
    Renault: "Mid"
    Skoda: "Mid"
    Toyota: "Mid"
    Volkswagen: "Mid"
    Kia: "Premium"
    Mg: "Premium"
    Force: "Premium"
    Isuzu: "Premium"
    Jeep: "Premium"
    Audi: "Luxury"
    Bmw: "Luxury"
    Jaguar: "Luxury"
    Land Rover: "Luxury"
    Lexus: "Luxury"
    Mercedes-Amg: "Luxury"
    Mercedes-Benz: "Luxury"
    Mini: "Luxury"
    Volvo: "Luxury"
    Bentley: "Ultra-Luxury"
    Ferrari: "Ultra-Luxury"
    Maserati: "Ultra-Luxury"
    Porsche: "Ultra-Luxury"
    Rolls-Royce: "Ultra-Luxury"

models:
  candidates:
    - "dummy"
    - "linear_regression"
    - "ridge"
    - "lasso"
    - "k_nearest_neighbors"
    - "decision_tree"
    - "random_forest"
    - "hist_gradient_boosting"
    - "xgboost"
    - "lightgbm"
  tuning_trials: 35
  timeout_seconds: 3600

