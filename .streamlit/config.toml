[theme]
# Shared by both modes. No `base`: with [theme.light] and [theme.dark] defined, the app
# follows the visitor's system setting and offers Light / Dark / System (D-036).
# Visual system: D-045 (zinc neutrals, blue actions, amber highlight, Geist).
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap, monospace"

# Chart colour slots (both modes, same order, app/components/palette.py):
# 1-6 the categorical series (1 primary, 2 ink, 3 highlight), 7 muted text, 8 border,
# 9 gridlines, 10 card surface. Source of truth: src/carprice/palette.py *_CHART_SLOTS.
# Streamlit swaps these into Plotly figures in the browser, so charts follow the theme.

[theme.light]
primaryColor = "#2F5BEA"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18181B"
linkColor = "#2F5BEA"
redColor = "#DC2626"
greenColor = "#15803D"
borderColor = "#E4E4E7"
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#FAFAFA"
chartCategoricalColors = ["#2F5BEA", "#18181B", "#D97706", "#0D9488", "#BE185D", "#8B8B94", "#71717A", "#E4E4E7", "#F0F0F2", "#FFFFFF"]
chartSequentialColors = ["#FFFFFF", "#E8EDFD", "#D1DBFA", "#BAC8F8", "#A3B6F6", "#8BA4F3", "#7492F1", "#5D7FEF", "#466DEC", "#2F5BEA"]

# Dark counterpart: near-black page, brightened blue for lines and links. Buttons keep
# the light blue #2F5BEA (white text 5.5:1).
[theme.dark]
primaryColor = "#2F5BEA"
backgroundColor = "#0B0B0D"
secondaryBackgroundColor = "#141417"
textColor = "#EDEDEF"
linkColor = "#7C9BFF"
redColor = "#F87171"
greenColor = "#4ADE80"
borderColor = "#27272A"
dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#0B0B0D"
chartCategoricalColors = ["#7C9BFF", "#EDEDEF", "#F59E0B", "#2DD4BF", "#F472B6", "#71717A", "#A1A1AA", "#27272A", "#1E1E22", "#141417"]
chartSequentialColors = ["#141417", "#202331", "#2B324B", "#374164", "#42507E", "#4E5F98", "#596EB2", "#657DCB", "#708CE5", "#7C9BFF"]

[client]
# Never show Python tracebacks to users; details go to the server console only.
showErrorDetails = "none"
toolbarMode = "viewer"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
runOnSave = false
